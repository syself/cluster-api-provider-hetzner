version: "2"

linters:
  enable:
    - dupl
    - goconst
    - gocyclo
    - godox
    - gosec
    - lll
    - misspell
    - prealloc
    - staticcheck
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst

formatters:
  enable:
    - gofmt
